name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Domain Package
        run: npm run build -w @fairtab/domain

      - name: Build Functions Package
        run: npm run build --prefix functions

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Firestore Security Rules Tests
        run: npm run test:rules

#       - name: Playwright E2E Tests (Emulator-backed)
#         run: npm run test:e2e
#         env:
#           VITE_USE_FIREBASE_EMULATORS: true
#           VITE_FIREBASE_API_KEY: mock-api-key
#           VITE_FIREBASE_AUTH_DOMAIN: mock-auth-domain
#           VITE_FIREBASE_PROJECT_ID: mock-project-id
#           VITE_FIREBASE_MESSAGING_SENDER_ID: mock-sender-id
#           VITE_FIREBASE_APP_ID: mock-app-id
# 
#       - name: Upload Playwright Report
#         uses: actions/upload-artifact@v4
#         if: always()
#         with:
#           name: playwright-report
#           path: playwright-report/
#           retention-days: 5

      - name: Build
        run: npm run build
        env:
          VITE_APP_BASE_PATH: ${{ vars.VITE_APP_BASE_PATH || '/FairTab/' }}
          VITE_USE_FIREBASE_EMULATORS: ${{ vars.VITE_USE_FIREBASE_EMULATORS || 'false' }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'fairtab-48340' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_REQUIRE_EMAIL_VERIFICATION: ${{ vars.VITE_REQUIRE_EMAIL_VERIFICATION }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
